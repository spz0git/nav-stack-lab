# Deploys the committed dist/ to GitHub Pages on every push to main (and on demand), so the demo at
# https://spz0git.github.io/nav-stack-lab/ is always the page at the head of main. The repository's Pages setting
# must be "GitHub Actions" (Settings → Pages → Source).
name: Deploy demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p site
          cp dist/nav-stack-lab.html site/index.html
          cp dist/nav-stack-lab.html dist/core-worker.js site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
