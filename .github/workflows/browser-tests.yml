# The full Playwright suite (tests/run_all.py: all eleven browser tests) every night and on demand from the Actions
# tab. A PR runs only the tests its change needs (run_all.py --changed); this run catches what a scope missed. It
# drives the built page in a headless Chromium; about twelve minutes.
name: Browser tests
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: node build.mjs
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run the gate
        run: python3 tests/run_all.py
